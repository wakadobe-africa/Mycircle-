# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse-proxy config for MyCIRCLE
#
# Place this file at /etc/nginx/sites-available/mycircle and enable it with:
#   sudo ln -s /etc/nginx/sites-available/mycircle /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace "your-domain.com" with your actual domain (or server IP).
# For HTTPS use Certbot: sudo certbot --nginx -d your-domain.com
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Serve user-uploaded static files directly from Nginx for performance
    location /static/uploads/ {
        alias /app/mycirclepkg/static/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Serve other static assets directly
    location /static/ {
        alias /app/mycirclepkg/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Forward all other requests to Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Increase timeouts for long-running requests
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;

        # File upload size limit (adjust to match your app's needs)
        client_max_body_size 10M;
    }
}
